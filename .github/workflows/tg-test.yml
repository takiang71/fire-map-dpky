# ปุ่มทดสอบ Telegram (Actions → tg-test → Run workflow) — ใช้ token ที่เก็บใน secret TG_TOKEN ไม่ต้องวาง token ในเครื่อง · ไม่ deploy และไม่แตะ tg_notify.json
# chats = แสดงรหัสห้องที่บอทอยู่ (เชิญบอทเข้ากลุ่มแล้วพิมพ์ /start@ชื่อบอท ในกลุ่มก่อน) → เอาไปตั้ง Variable TG_CHAT_ID / TG_ADMIN_ID
name: tg-test
on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'สิ่งที่จะทำ'
        type: choice
        default: chats
        options:
          - chats       # แสดงรหัสห้อง (ไม่ส่งข้อความ)
          - test-push   # ข้อความแจ้งเตือน (จุดจริงย้อนหลัง 5 จุด ติดป้าย ทดสอบ)
          - daily       # สรุปประจำวัน
          - burn        # พื้นที่เผาไหม้รอบล่าสุด
          - watch       # พื้นที่เฝ้าระวังพิเศษ (โรงเรียนนายร้อยพระจุลจอมเกล้า)
          - preview     # แสดงข้อความทุกแบบใน log (ไม่ส่ง)
      to:
        description: 'ส่งถึง (admin = แชตส่วนตัวของผู้ดูแล TG_ADMIN_ID · ไม่กวนกลุ่ม)'
        type: choice
        default: group
        options:
          - group
          - admin

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/build_site.js || true
      # to=admin แต่ยังไม่ตั้ง TG_ADMIN_ID → หยุด (ไม่ตกกลับไปส่งเข้ากลุ่ม)
      - if: inputs.to == 'admin'
        run: test -n "$A" || { echo 'ยังไม่ได้ตั้ง TG_ADMIN_ID'; exit 1; }
        env:
          A: ${{ vars.TG_ADMIN_ID || secrets.TG_ADMIN_ID }}
      - run: node scripts/telegram_notify.js --${{ inputs.kind }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ inputs.to == 'admin' && (vars.TG_ADMIN_ID || secrets.TG_ADMIN_ID) || vars.TG_CHAT_ID || secrets.TG_CHAT_ID }}
