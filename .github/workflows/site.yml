# เผยแพร่หน้าเว็บขึ้น GitHub Pages พร้อม live.json (จุดความร้อน 48 ชม. กรองเฉพาะกลุ่มป่าแล้ว) และ air4thai.json
# ตั้งไว้ทุก 10 นาที แต่ GitHub รันจริงแค่ทุก 2–5 ชม. → ให้ cron-job.org เรียก workflow_dispatch ทุก 5 นาทีแทน (docs/line-bot.md ข้อ 6) + ทุกครั้งที่ push
name: site
on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # ผู้สั่งรัน: ว่าง = cron-job.org/กดเอง · watchdog = ตัวสั่งงานสำรองบน Cloudflare (worker/watchdog.mjs) · sync = workflow sync
      by:
        description: "ผู้สั่งรัน (ปล่อยว่างได้)"
        required: false
        default: ""

permissions:
  contents: write   # push สถานะการแจ้งเตือนไป branch state
  pages: write
  actions: write    # สั่ง workflow wx เมื่อต้นทางข้อมูลพยากรณ์มีรอบใหม่ (scripts/wx_check.js)
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # สถานะการแจ้งเตือนรอบก่อน (จุดที่แจ้งแล้ว / สรุปประจำวันส่งแล้วหรือยัง) จาก branch state → .state/ (scripts/lib/state.js)
      # เดิมอ่านกลับจากหน้าเว็บอย่างเดียว — 6 พ.ย. 69 Pages ค้างทั้งที่ deploy สำเร็จ ทำให้สรุปประจำวันส่งซ้ำทุก 5 นาที
      - name: load state
        run: |
          mkdir -p .state
          if git fetch -q --depth=1 origin state; then
            # reports.json = สำเนารายงานผลตรวจสอบจาก Worker fire-layers รอบก่อน (F1 — ใช้เมื่อ Worker ล่ม)
            # live_cache.json = จุดจาก API รอบก่อน (build_site.js ดึงแค่ 12 ชม. ล่าสุดแล้วรวมกับไฟล์นี้ ลดภาระ API ต้นทาง · ไม่มี = ดึงเต็ม 48 ชม.)
            # pass_lag.json = ความล่าช้าจริงของต้นทางต่อรอบดาวเทียม (scripts/pass_wait.js)
            # tg_subs.json = การสมัครแจ้งเตือน Telegram รายพื้นที่ + offset ของ getUpdates (F6 — ข้อมูลส่วนบุคคล: อยู่ใน .state/ ไม่ขึ้น Pages)
            # firms_lag.json = ความล่าช้าของ NASA FIRMS ต่อรอบดาวเทียม เทียบ API ไทย (scripts/firms_lag.js)
            for f in notify.json tg_notify.json health.json live_cache.json pass_lag.json firms_lag.json reports.json tg_subs.json dnpform.json; do git show FETCH_HEAD:$f > .state/$f 2>/dev/null || rm -f .state/$f; done
          else echo "ยังไม่มี branch state"; fi
          ls -l .state
      # ช่วงที่ข้อมูลรอบดาวเทียมกำลังเข้า (8–90 นาทีหลังผ่านกลุ่มป่า ตาม data/tle.json) และยังไม่เข้า → ถาม API ทุก 45 วิ ≤4 นาที
      # เห็นข้อมูลรอบนั้นเมื่อไร ไปสร้างเว็บ/แจ้งเตือนทันที (ไม่ต้องรอรอบ cron-job.org ถัดไป 5 นาที) · นอกช่วง = ไม่รอ
      - name: wait for satellite pass data
        timeout-minutes: 6
        continue-on-error: true
        run: node scripts/pass_wait.js
      # ตาราง FWI กรอบรอบกลุ่มป่าของ TFDRS (data/fwi/g/<วันที่>.json 9 ไฟล์ ~3 MB — เลิกเก็บตารางเต็มพื้นที่ 14 พ.ย. 69) อยู่ที่ branch fwi-grid (commit เดียว force push ไม่สะสมประวัติ) ไม่ใช่ main
      - name: load fwi grids
        run: |
          mkdir -p data/fwi/g
          if git fetch -q --depth=1 origin fwi-grid; then git archive FETCH_HEAD | tar -x -C data/fwi/g; git rev-parse 'FETCH_HEAD^{tree}' > "$RUNNER_TEMP/fwi_tree"; else echo "ยังไม่มี branch fwi-grid"; fi
          ls data/fwi/g | wc -l
      # ชุดทดสอบหน่วย (test/*.test.js — docs/arch/testing.md: ตัดจุดซ้ำ, วงโคจร, แนวเขต, ปีงบ, สรุปประจำวัน …) ใช้เวลา <5 วิ
      # ไม่ผ่าน = ไม่ขึ้น index.html ฉบับใหม่ (ขั้น check site ใช้ฉบับบนเว็บแทน แบบเดียวกับตรวจหน้าเว็บไม่ผ่าน) + health.js แจ้งผู้ดูแล
      # ไม่หยุดทั้งรอบ เพราะ live.json และการแจ้งเตือนจุดความร้อนต้องทำงานต่อ
      - name: unit tests
        id: unit
        continue-on-error: true
        timeout-minutes: 3
        # = node --test test/ + พิมพ์ชื่อเทสต์ที่ล้มเป็น annotation (อ่านได้โดยไม่ต้องล็อกอินเปิด log)
        run: node scripts/unit_ci.js
      # ถ้าดึงข้อมูลไม่สำเร็จก็ยังเผยแพร่หน้าเว็บ (หน้าเว็บจะถอยไปดึง API ตรงเอง)
      - run: node scripts/build_site.js || true
      # ต้นทาง FWI/FFMC (TFDRS) · อัตราการระบายอากาศ (GFS) · PM2.5 (CAMS) มีรอบใหม่กว่าที่เรามีไหม (คำขอเล็ก ≤10 วิ)
      # → _site/data/wxsrc.json (หน้าเว็บบอกรอบ/เวลาเผยแพร่/เวลาดึง/ตรวจล่าสุด และโหลดใหม่เมื่อรอบเปลี่ยน) + มีรอบใหม่ = สั่ง workflow wx ดึงทันที
      - name: check forecast sources
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/wx_check.js --dispatch
        env:
          GH_TOKEN: ${{ github.token }}
      # ความล่าช้าของ NASA FIRMS ต่อรอบดาวเทียม (ผู้ใช้ขอ 21 พ.ย. 69 ใช้ในสไลด์ present/) — รอบที่ API ไทยเห็นแล้ว (pass_lag.json) อายุ 45 นาที–12 ชม.
      # ถาม FIRMS ดาวเทียมละ 1 คำขอเฉพาะช่วงที่มีรอบค้าง → .state/firms_lag.json · สรุป: node scripts/firms_lag.js --report
      - name: firms lag
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/firms_lag.js
        env:
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}
      # ตรวจหน้าเว็บก่อนขึ้น Pages (scripts/check_site.js): syntax ทุก <script> + เปิดใน Chrome headless เดสก์ท็อป/มือถือ กดปุ่มหลัก นับ error
      # ไม่ผ่าน = ใช้ index.html ฉบับบนเว็บแทน (ข้อมูลอื่นยังขึ้นปกติ) + health.js แจ้งผู้ดูแล · index.html ตรงกับรอบที่ตรวจแล้ว = ใช้ผลเดิม ไม่เปิด Chrome
      - name: check site
        continue-on-error: true
        # 9 นาที (เดิม 6): ทั้งชุดใช้ ~6 นาทีบนเครื่อง Actions — หมดเวลา = ไม่มี check.json ทุกรอบต่อไปตรวจใหม่ยาวเกินรอบ 5 นาที (19 พ.ย. 69) · ผ่านแล้วรอบต่อไปใช้ผลเดิม
        timeout-minutes: 9
        run: node scripts/check_site.js _site --ci
        env:
          # ผลชุดทดสอบหน่วย: failure = ถือว่าไม่ผ่าน (ใช้ index.html ฉบับบนเว็บ)
          UNIT: ${{ steps.unit.outcome }}
      # C2: ตัวเลขสะสมของหน้าเว็บ (โค้ดจริงจาก _site/index.html) ↔ summary.json ↔ การ์ด LINE ↔ สรุปประจำวัน Telegram ต้องเท่ากัน
      # ต่างกัน = ::warning + _site/numcheck.json ok:false → health.js (`num`) แจ้งผู้ดูแล · ไม่หยุดรอบ (การแจ้งเตือนยังทำงาน)
      - name: verify numbers
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/verify_numbers.js _site --ci
      # แจ้งเตือนจุดใหม่เข้ากลุ่ม LINE (docs/line-bot.md) — ไม่ตั้ง secret ก็ยังเก็บสถานะ notify.json ไว้
      - run: node scripts/line_notify.js || true
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_GROUP_ID: ${{ vars.LINE_GROUP_ID }}
          LINE_MAX_DAY: ${{ vars.LINE_MAX_DAY }}
          LINE_RESERVE: ${{ vars.LINE_RESERVE }}
          # สรุปประจำวัน เวลาไทย HH:MM (ไม่ตั้ง = 05:30, "off" = ปิด)
          LINE_DAILY: ${{ vars.LINE_DAILY }}
          # การ์ดพื้นที่เผาไหม้เมื่อมีรอบใหม่ ("off" = ปิด)
          LINE_BURN: ${{ vars.LINE_BURN }}
          # A7 แผนย้ายกลุ่มจริง (docs/line-rollout.md): all (ไม่ตั้ง) | daily = LINE ส่งเฉพาะสรุปประจำวัน + การ์ดเผาไหม้
          LINE_MODE: ${{ vars.LINE_MODE }}
          # ลิงก์เชิญกลุ่ม Telegram https://t.me/… — แสดงในสรุปประจำวันของ LINE เฉพาะ LINE_MODE=daily
          TG_INVITE: ${{ vars.TG_INVITE }}
      # แจ้งเตือนคู่ขนานทาง Telegram (docs/telegram-bot.md) — สถานะแยกใน tg_notify.json · ไม่ตั้ง secret ก็ข้าม
      - run: node scripts/telegram_notify.js || true
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID || secrets.TG_CHAT_ID }}
          # สรุปประจำวัน เวลาไทย HH:MM (ไม่ตั้ง = 05:30, "off" = ปิด)
          TG_DAILY: ${{ vars.TG_DAILY }}
          # ข้อความพื้นที่เผาไหม้เมื่อมีรอบใหม่ ("off" = ปิด)
          TG_BURN: ${{ vars.TG_BURN }}
          # F6 สมัครรับแจ้งเตือนรายพื้นที่ทางแชตส่วนตัว (/ตาม ทับลาน) — "off" = ปิด (ไม่อ่านคำสั่ง ไม่ส่งข้อความส่วนตัว)
          TG_SUBS: ${{ vars.TG_SUBS }}
      # แจ้งเตือนผู้ดูแลเมื่อระบบเสีย (scripts/health.js) — ส่งถึง LINE_ADMIN_ID / TG_ADMIN_ID คนเดียว ไม่ตั้ง = บันทึกสถานะใน health.json อย่างเดียว
      - run: node scripts/health.js || true
        env:
          # ใครสั่งรอบนี้ — health.js แจ้งเมื่อตัวสำรองต้องสั่งแทน cron-job.org ต่อเนื่องเกิน 1 ชม.
          RUN_BY: ${{ inputs.by }}
          RUN_EV: ${{ github.event_name }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_ADMIN_ID: ${{ vars.LINE_ADMIN_ID }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_ADMIN_ID: ${{ vars.TG_ADMIN_ID || secrets.TG_ADMIN_ID }}
      # เก็บสถานะรอบนี้ไว้ที่ branch state (commit เดียว force push — ไม่สะสมประวัติ, push ด้วย GITHUB_TOKEN ไม่ปลุก workflow อื่น)
      - name: save state
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/st" && cd "$RUNNER_TEMP/st"
          n=0; for f in notify.json tg_notify.json health.json; do if [ -f "$GITHUB_WORKSPACE/_site/$f" ]; then cp "$GITHUB_WORKSPACE/_site/$f" .; n=$((n+1)); fi; done
          # แคช API ของ build_site.js อยู่ใน .state/ (ไม่ขึ้น Pages)
          for f in live_cache.json pass_lag.json firms_lag.json reports.json tg_subs.json dnpform.json; do if [ -f "$GITHUB_WORKSPACE/.state/$f" ]; then cp "$GITHUB_WORKSPACE/.state/$f" .; n=$((n+1)); fi; done
          # การสมัคร F6 ห้ามหาย: ไม่มีใน .state (โหลดตอนต้นไม่ได้ / telegram_notify ข้ามรอบ) → ดึงฉบับเดิมจาก branch state ก่อน force push
          if [ ! -f tg_subs.json ]; then (cd "$GITHUB_WORKSPACE" && git fetch -q --depth=1 origin state && git show FETCH_HEAD:tg_subs.json) > tg_subs.json 2>/dev/null || rm -f tg_subs.json; fi
          [ "$n" -gt 0 ] || { echo "ไม่มีไฟล์สถานะ"; exit 0; }
          git init -q -b state
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "state $(date -u +%FT%TZ)"
          for i in 1 2 3; do git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state && break; sleep 5; done
      - uses: actions/configure-pages@v6
      # v4 ขึ้นไปตัดไฟล์ที่ขึ้นต้นด้วยจุด (.nojekyll จาก build_site.js) ออกจาก artifact ถ้าไม่ตั้ง include-hidden-files — ตั้งไว้ให้เหมือน v3 เดิม
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      # Pages บางครั้งยังถือว่ารอบก่อน "กำลัง deploy" อยู่หลังรอบนั้นจบแล้ว (เจอ 10 พ.ย. 69: push ตามหลังรอบ cron
      # → "Deployment request failed … due to in progress deployment" ติดกัน 2 รอบ หน้าเว็บช้าไป ~15 นาที) → รอแล้วลองใหม่ในรอบเดียวกัน
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 120
      - if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v5
