# เผยแพร่หน้าเว็บขึ้น GitHub Pages พร้อม live.json (จุดความร้อน 48 ชม. กรองเฉพาะกลุ่มป่าแล้ว) และ air4thai.json
# ตั้งไว้ทุก 10 นาที แต่ GitHub รันจริงแค่ทุก 2–5 ชม. → ให้ cron-job.org เรียก workflow_dispatch ทุก 10 นาทีแทน (docs/line-bot.md ข้อ 6) + ทุกครั้งที่ push
name: site
on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ถ้าดึงข้อมูลไม่สำเร็จก็ยังเผยแพร่หน้าเว็บ (หน้าเว็บจะถอยไปดึง API ตรงเอง)
      - run: node scripts/build_site.js || true
      # แจ้งเตือนจุดใหม่เข้ากลุ่ม LINE (docs/line-bot.md) — ไม่ตั้ง secret ก็ยังเก็บสถานะ notify.json ไว้
      - run: node scripts/line_notify.js || true
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_GROUP_ID: ${{ vars.LINE_GROUP_ID }}
          LINE_MAX_DAY: ${{ vars.LINE_MAX_DAY }}
          LINE_RESERVE: ${{ vars.LINE_RESERVE }}
          # สรุปประจำวัน เวลาไทย HH:MM (ไม่ตั้ง = 07:30, "off" = ปิด)
          LINE_DAILY: ${{ vars.LINE_DAILY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
