# เผยแพร่หน้าเว็บขึ้น GitHub Pages พร้อม live.json (จุดความร้อน 48 ชม. กรองเฉพาะกลุ่มป่าแล้ว) และ air4thai.json
# ตั้งไว้ทุก 10 นาที แต่ GitHub รันจริงแค่ทุก 2–5 ชม. → ให้ cron-job.org เรียก workflow_dispatch ทุก 5 นาทีแทน (docs/line-bot.md ข้อ 6) + ทุกครั้งที่ push
name: site
on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # push สถานะการแจ้งเตือนไป branch state
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # สถานะการแจ้งเตือนรอบก่อน (จุดที่แจ้งแล้ว / สรุปประจำวันส่งแล้วหรือยัง) จาก branch state → .state/ (scripts/lib/state.js)
      # เดิมอ่านกลับจากหน้าเว็บอย่างเดียว — 6 พ.ย. 69 Pages ค้างทั้งที่ deploy สำเร็จ ทำให้สรุปประจำวันส่งซ้ำทุก 5 นาที
      - name: load state
        run: |
          mkdir -p .state
          if git fetch -q --depth=1 origin state; then
            for f in notify.json tg_notify.json health.json; do git show FETCH_HEAD:$f > .state/$f 2>/dev/null || rm -f .state/$f; done
          else echo "ยังไม่มี branch state"; fi
          ls -l .state
      # ถ้าดึงข้อมูลไม่สำเร็จก็ยังเผยแพร่หน้าเว็บ (หน้าเว็บจะถอยไปดึง API ตรงเอง)
      - run: node scripts/build_site.js || true
      # แจ้งเตือนจุดใหม่เข้ากลุ่ม LINE (docs/line-bot.md) — ไม่ตั้ง secret ก็ยังเก็บสถานะ notify.json ไว้
      - run: node scripts/line_notify.js || true
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_GROUP_ID: ${{ vars.LINE_GROUP_ID }}
          LINE_MAX_DAY: ${{ vars.LINE_MAX_DAY }}
          LINE_RESERVE: ${{ vars.LINE_RESERVE }}
          # สรุปประจำวัน เวลาไทย HH:MM (ไม่ตั้ง = 05:30, "off" = ปิด)
          LINE_DAILY: ${{ vars.LINE_DAILY }}
          # การ์ดพื้นที่เผาไหม้เมื่อมีรอบใหม่ ("off" = ปิด)
          LINE_BURN: ${{ vars.LINE_BURN }}
      # แจ้งเตือนคู่ขนานทาง Telegram (docs/telegram-bot.md) — สถานะแยกใน tg_notify.json · ไม่ตั้ง secret ก็ข้าม
      - run: node scripts/telegram_notify.js || true
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID || secrets.TG_CHAT_ID }}
          # สรุปประจำวัน เวลาไทย HH:MM (ไม่ตั้ง = 05:30, "off" = ปิด)
          TG_DAILY: ${{ vars.TG_DAILY }}
          # ข้อความพื้นที่เผาไหม้เมื่อมีรอบใหม่ ("off" = ปิด)
          TG_BURN: ${{ vars.TG_BURN }}
      # แจ้งเตือนผู้ดูแลเมื่อระบบเสีย (scripts/health.js) — ส่งถึง LINE_ADMIN_ID / TG_ADMIN_ID คนเดียว ไม่ตั้ง = บันทึกสถานะใน health.json อย่างเดียว
      - run: node scripts/health.js || true
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_ADMIN_ID: ${{ vars.LINE_ADMIN_ID }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_ADMIN_ID: ${{ vars.TG_ADMIN_ID || secrets.TG_ADMIN_ID }}
      # เก็บสถานะรอบนี้ไว้ที่ branch state (commit เดียว force push — ไม่สะสมประวัติ, push ด้วย GITHUB_TOKEN ไม่ปลุก workflow อื่น)
      - name: save state
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/st" && cd "$RUNNER_TEMP/st"
          n=0; for f in notify.json tg_notify.json health.json; do if [ -f "$GITHUB_WORKSPACE/_site/$f" ]; then cp "$GITHUB_WORKSPACE/_site/$f" .; n=$((n+1)); fi; done
          [ "$n" -gt 0 ] || { echo "ไม่มีไฟล์สถานะ"; exit 0; }
          git init -q -b state
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "state $(date -u +%FT%TZ)"
          for i in 1 2 3; do git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state && break; sleep 5; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Pages บางครั้งยังถือว่ารอบก่อน "กำลัง deploy" อยู่หลังรอบนั้นจบแล้ว (เจอ 10 พ.ย. 69: push ตามหลังรอบ cron
      # → "Deployment request failed … due to in progress deployment" ติดกัน 2 รอบ หน้าเว็บช้าไป ~15 นาที) → รอแล้วลองใหม่ในรอบเดียวกัน
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 120
      - if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
