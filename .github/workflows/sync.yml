# เก็บสะสมจุดความร้อนรายวันลงฐานข้อมูล (adata ใน index.html + data/hotspots_api.json) แล้ว commit กลับเข้า repo
# 06:17 09:17 15:17 18:17 น. เวลาไทย หลังดาวเทียมผ่านรอบ ~01:30 และ ~13:30 — ตั้งไว้ 4 รอบเผื่อ GitHub ข้ามรอบตั้งเวลา
# (28 ต.ค. 69 รอบ 15:00 หายไปเฉยๆ) และเลี่ยงต้นชั่วโมงที่คิวแน่น
# push ด้วย GITHUB_TOKEN จะไม่ปลุก workflow อื่นเอง จึงสั่ง workflow "site" ให้เผยแพร่ใหม่ทันทีในขั้นสุดท้าย
name: sync
on:
  schedule:
    - cron: '17 23,2,8,11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync_hotspots.js
      # พื้นที่เผาไหม้ราย 7 วันจากระบบตามรอยเผา (ออกสัปดาห์ละครั้ง ส่วนใหญ่ไม่มีอะไรใหม่) — พลาดก็ไม่ให้กระทบจุดความร้อน
      - run: node scripts/sync_burn.js || true
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/hotspots_api.json data/burn "data/FY2569_SNPP_ทั้งกลุ่มป่า.csv"
          if git diff --cached --quiet; then echo "ไม่มีข้อมูลใหม่"; exit 0; fi
          git commit -m "sync: จุดความร้อนสะสม $(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
      - name: deploy now
        run: gh workflow run site.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
