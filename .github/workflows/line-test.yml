# ปุ่มส่งการ์ด LINE ทดสอบเข้ากลุ่ม (Actions → line-test → Run workflow) — ใช้ token ที่เก็บใน secret อยู่แล้ว ไม่ต้องวาง token ในเครื่อง
# แต่ละครั้งใช้โควตาเท่าจำนวนสมาชิกกลุ่ม ยกเว้น validate (ให้ LINE ตรวจรูปแบบอย่างเดียว ไม่ส่ง) · ไม่ deploy และไม่แตะ notify.json
name: line-test
on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'การ์ดที่จะส่ง'
        type: choice
        default: test-push
        options:
          - test-push   # การ์ดแจ้งเตือน (จุดจริงย้อนหลัง 5 จุด ติดป้าย ทดสอบ)
          - daily       # สรุปประจำวัน
          - burn        # พื้นที่เผาไหม้รอบล่าสุด
          - watch       # พื้นที่เฝ้าระวังพิเศษ (โรงเรียนนายร้อยพระจุลจอมเกล้า)
          - validate    # ตรวจรูปแบบอย่างเดียว ไม่ส่ง ไม่เสียโควตา
      to:
        description: 'ส่งถึง (admin = แชตส่วนตัวของผู้ดูแล LINE_ADMIN_ID — ใช้โควตา 1 ข้อความ · ไม่กวนกลุ่ม)'
        type: choice
        default: group
        options:
          - group
          - admin

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/build_site.js || true
      - if: inputs.to == 'admin' && vars.LINE_ADMIN_ID == ''
        run: echo 'ยังไม่ได้ตั้ง Variable LINE_ADMIN_ID' && exit 1
      - run: node scripts/line_notify.js --${{ inputs.kind }}
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_GROUP_ID: ${{ inputs.to == 'admin' && vars.LINE_ADMIN_ID || vars.LINE_GROUP_ID }}
          LINE_MODE: ${{ vars.LINE_MODE }}
          TG_INVITE: ${{ vars.TG_INVITE }}
